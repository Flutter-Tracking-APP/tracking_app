name: Check PR Title (Conventional Commits)

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate_pr_title:
    name: Validate Conventional Commit PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Syntax
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed commit types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Allow optional scope, e.g. "feat(auth): add google sign-in"
          requireScope: false
          # Disallow subject starting with uppercase letter for consistency
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The title subject must start with a lowercase letter.
            Example: "feat(login): add remember me checkbox"